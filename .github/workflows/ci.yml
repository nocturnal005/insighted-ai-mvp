name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 is required by `npm test`: the behavioural suite runs the TypeScript
          # sources directly through Node's type stripping, which does not exist on 20.
          # The application and `npm run validate` still run on 20 — the validator
          # transpiles TypeScript itself rather than relying on the runtime.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run validate
